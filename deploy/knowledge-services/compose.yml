# Linux host networking preserves the server's strict 127.0.0.1 binding.
# Do not change to 0.0.0.0 or publish it directly on the Internet.
services:
  core:
    build:
      context: ../..
      dockerfile: deploy/knowledge-services/Dockerfile
    network_mode: host
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    tmpfs: [/tmp:size=512m,mode=1777]
    volumes:
      - ./state:/state
      - ./models:/models:ro
    secrets: [bridge_token]
    environment:
      EXPERTOS_BRIDGE_TOKEN_FILE: /run/secrets/bridge_token
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import pathlib,urllib.request; t=pathlib.Path('/run/secrets/bridge_token').read_text().strip(); urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8765/health',headers={'Authorization':'Bearer '+t}),timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
secrets:
  bridge_token:
    file: ./secrets/bridge_token.txt
