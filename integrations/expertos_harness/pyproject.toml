[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expertos-harness-bridge"
version = "0.1.0"
description = "Loopback neural expert bridge for DeepSeek Harness"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
training = ["torch>=2.2"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["python"]
